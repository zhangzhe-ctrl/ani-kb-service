name: KB Service CI

# KB-SPLIT-P5A（issue-068，ADR 0001 §五-阶段5）：kb-service 已从 ANI monorepo
# 整目录迁移为本独立仓库，本 workflow 随迁并改为仓库根上下文：
#   - 独立仓库整体即 kb-service，路径过滤不再需要（workflow 自身变更仍触发）
#   - SemVer 发布 tag 沿用 `kb-v*.*.*` 约定（见 docs/specs/semver-tagging.md）
#   - lint / test / migration 校验 / 镜像构建 / Trivy / Cosign 安全姿态不变
#
# 触发：
#   - push / pull_request：全分支门禁
#   - push tag `kb-v*.*.*`：SemVer 发布（构建并推送镜像）
#   - workflow_dispatch：手动指定 tag
on:
  push:
    branches:
      - "**"
    paths:
      - "**"
      - ".github/workflows/kb-service-ci.yml"
    tags:
      - "kb-v*.*.*"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/kb-service-ci.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "kb-service image tag (SemVer, e.g. 1.0.0)"
        required: true

# 最小权限：拉代码用默认 GITHUB_TOKEN 只读即可；镜像推送凭据走 secrets
# （Harbor 账号），不依赖 GitHub OIDC / id-token。
permissions:
  contents: read

env:
  REGISTRY_HOST: harbor.ani.internal
  REGISTRY: harbor.ani.internal/ani

jobs:
  gate:
    name: Lint / Test / Migration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          # 钉死 lint 工具版本：门禁"全绿"结论对版本敏感，浮动版本会让
          # 上游发版静默改变门禁行为（本地验证基线 ruff 0.16.2 / mypy 2.3.0）。
          pip install --no-cache-dir ruff==0.16.2 mypy==2.3.0

      # kb 自带 Makefile 门禁（仓库自含，不依赖任何外部根 Makefile）：
      # lint → validate-architecture → validate-migrations → test-python
      - name: Run kb-service gates
        run: make test

      - name: git diff --check (whitespace gate)
        run: git diff --check

  build-image:
    name: Build & push kb-service image (SemVer)
    runs-on: ubuntu-latest
    needs: gate
    # 仅在 SemVer tag 推送或手动派发时构建推送镜像；PR/分支只跑门禁。
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/kb-v')
    steps:
      - uses: actions/checkout@v4

      - name: Resolve SemVer tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF_NAME#kb-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate SemVer format
        run: |
          if ! echo "${{ steps.version.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must be SemVer MAJOR.MINOR.PATCH, got '${{ steps.version.outputs.version }}'"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/kb-service:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/kb-service:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/kb-service:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/kb-service:buildcache,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/kb-service@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (Cosign)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/kb-service@${{ steps.build.outputs.digest }}

      - name: Record digest evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ env.REGISTRY }}/kb-service@${{ steps.build.outputs.digest }}" \
            > "$RUNNER_TEMP/kb-service.digest.txt"

      - name: Upload digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: kb-service-image-digest
          path: ${{ runner.temp }}/kb-service.digest.txt
          if-no-files-found: error
          retention-days: 30
